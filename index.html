<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>익명 매칭 채팅</title>
<style>
  :root{
    --bg:#faf8f5; --panel:#fff; --accent:#6c5ce7; --accent-dark:#5a4bd1;
    --text:#222; --sub:#888; --border:#eee; --bubble-me:#6c5ce7; --bubble-other:#f1f0f5;
    --danger:#e74c3c;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
    background:var(--bg); color:var(--text); min-height:100vh;
  }
  .wrap{ max-width:480px; margin:0 auto; min-height:100vh; background:var(--panel); display:flex; flex-direction:column; box-shadow:0 0 24px rgba(0,0,0,0.04); }
  header{ padding:16px 20px; border-bottom:1px solid var(--border); display:flex; align-items:center; justify-content:space-between; }
  header h1{ font-size:17px; margin:0; }
  header .sub{ font-size:12px; color:var(--sub); }
  .screen{ flex:1; display:flex; flex-direction:column; padding:20px; }
  .hidden{ display:none !important; }

  /* Landing */
  .landing{ flex:1; display:flex; flex-direction:column; justify-content:center; align-items:center; text-align:center; gap:16px; padding:20px;}
  .landing h2{ font-size:22px; margin:0 0 4px; }
  .landing p{ color:var(--sub); font-size:14px; line-height:1.6; margin:0; }
  .btn{ background:var(--accent); color:#fff; border:none; border-radius:12px; padding:14px 24px; font-size:15px; font-weight:600; cursor:pointer; width:100%; }
  .btn:active{ background:var(--accent-dark); }
  .btn.secondary{ background:#fff; color:var(--accent); border:1.5px solid var(--accent); }
  .btn.danger{ background:var(--danger); }
  .btn:disabled{ opacity:.5; cursor:not-allowed; }

  /* Form */
  .form-group{ margin-bottom:14px; }
  label{ display:block; font-size:13px; font-weight:600; margin-bottom:6px; color:#444; }
  input[type=text], input[type=number], textarea, select{
    width:100%; padding:12px 14px; border:1.5px solid var(--border); border-radius:10px; font-size:14px; font-family:inherit; background:#fcfcfc;
  }
  textarea{ resize:none; height:60px; }
  .radio-row{ display:flex; gap:8px; }
  .radio-row label{ flex:1; border:1.5px solid var(--border); border-radius:10px; padding:10px; text-align:center; font-weight:500; cursor:pointer; margin:0; font-size:13px; color:#555; }
  .radio-row input{ display:none; }
  .radio-row input:checked + span, .radio-row label:has(input:checked){ border-color:var(--accent); color:var(--accent); background:#f4f2ff; }
  .form-foot{ margin-top:auto; padding-top:20px; }

  /* Chat */
  .chat-header{ padding:14px 18px; border-bottom:1px solid var(--border); display:flex; justify-content:space-between; align-items:center; }
  .chat-header .info{ font-size:13px; color:var(--sub); }
  .chat-header .name{ font-weight:700; font-size:15px; }
  .messages{ flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:10px; }
  .msg{ max-width:75%; padding:10px 14px; border-radius:16px; font-size:14px; line-height:1.4; word-break:break-word; }
  .msg .sender{ font-size:11px; opacity:.7; margin-bottom:2px; font-weight:600; }
  .msg.me{ align-self:flex-end; background:var(--bubble-me); color:#fff; border-bottom-right-radius:4px; }
  .msg.other{ align-self:flex-start; background:var(--bubble-other); color:#333; border-bottom-left-radius:4px; }
  .msg.system{ align-self:center; background:transparent; color:var(--sub); font-size:12px; text-align:center; max-width:100%; }
  .msg img{ max-width:100%; border-radius:12px; display:block; margin-top:2px; cursor:pointer; }
  .msg.uploading{ opacity:.5; }
  .msg-time{ font-size:10px; opacity:.6; margin-top:4px; text-align:right; }
  .composer{ display:flex; gap:8px; padding:12px 14px; border-top:1px solid var(--border); }
  .composer input{ flex:1; }
  .composer button{ width:auto; padding:12px 18px; }

  /* Admin list */
  .room-card{ border:1.5px solid var(--border); border-left-width:5px; border-radius:12px; padding:14px; margin-bottom:10px; cursor:pointer; background:#fff; }
  .room-card.status-before{ background:#f6f3ff; border-color:#e0d9f7; border-left-color:#b6a3ef; }
  .room-card.status-waiting{ background:#fff8e9; border-color:#f5e2b8; border-left-color:#f0b95c; }
  .room-card.status-matched{ background:#eefbf3; border-color:#c9ecd7; border-left-color:#7bcf9e; }
  .room-card.closed{ opacity:.55; }
  .match-suggest{ font-size:12px; color:#6c5ce7; margin-top:8px; font-weight:600; background:#f4f2ff; padding:6px 10px; border-radius:8px; }
  .unread-dot{ display:inline-block; width:8px; height:8px; border-radius:50%; background:#e74c3c; margin-left:6px; vertical-align:middle; }
  .photo-tag{ background:#eaf3ff; color:#4a90d9; }
  .room-card .top{ display:flex; justify-content:space-between; align-items:center; margin-bottom:6px; }
  .room-card .nickname{ font-weight:700; font-size:15px; }
  .room-card .tag{ font-size:11px; padding:2px 8px; border-radius:20px; background:#eef; color:var(--accent); font-weight:600; }
  .room-card .tag.closed{ background:#eee; color:#999; }
  .room-card .meta{ font-size:12px; color:var(--sub); margin-bottom:4px; }
  .room-card .intro{ font-size:13px; color:#555; }
  .toolbar{ display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; }
  .empty{ text-align:center; color:var(--sub); font-size:13px; padding:40px 0; }
  .gender-tabs{ display:flex; gap:8px; margin-bottom:14px; }
  .tab-btn{ flex:1; padding:10px; border:1.5px solid var(--border); background:#fff; border-radius:10px; font-weight:700; font-size:13px; cursor:pointer; color:#555; }
  .tab-btn.active{ border-color:var(--accent); color:var(--accent); background:#f4f2ff; }
  .match-status-row{ margin-top:8px; }
  .match-status-select{ padding:6px 10px; font-size:12px; border-radius:8px; border:1.5px solid var(--border); background:#fcfcfc; font-weight:600; color:#555; }

  .passcode-box{ display:flex; flex-direction:column; gap:12px; justify-content:center; align-items:center; flex:1; text-align:center; padding:20px; }
  .link-row{ text-align:center; padding:10px 0; }
  .link-row a{ color:var(--sub); font-size:12px; text-decoration:underline; }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div>
      <h1 id="headerTitle">매칭 라운지</h1>
      <div class="sub" id="headerSub">편하게 대화 나눠요</div>
    </div>
    <div id="headerRight">
      <button class="notifyBtn" onclick="enableNotifications()" style="background:none;border:1.5px solid var(--border);border-radius:20px;padding:6px 12px;font-size:12px;cursor:pointer;color:var(--text);white-space:nowrap;">🔕 알림 켜기</button>
    </div>
  </header>

  <!-- LANDING -->
  <div id="screen-landing" class="screen landing">
    <h2>👋 안녕하세요</h2>
    <p>간단한 소개를 남기고 바로 대화방에 입장하세요.<br>익명 닉네임으로 진행됩니다.</p>
    <button class="btn" onclick="showScreen('form')">입장하기</button>
    <div class="link-row"><a href="#" onclick="showScreen('relogin');return false;">이미 신청하셨나요? 다시 입장하기</a></div>
    <div class="link-row"><a href="#" onclick="showAdminLogin();return false;">관리자이신가요?</a></div>
  </div>

  <!-- RELOGIN -->
  <div id="screen-relogin" class="screen hidden passcode-box">
    <h2>🔑 다시 입장하기</h2>
    <p style="color:var(--sub);font-size:13px;margin:0 0 4px;">신청할 때 입력한 닉네임과 출생연도를 입력해주세요.</p>
    <input type="text" id="relogin-nickname" placeholder="닉네임" style="text-align:center;max-width:240px;">
    <div style="display:flex;align-items:center;gap:8px;max-width:240px;width:100%;">
      <input type="number" id="relogin-birthyear" placeholder="예: 97" min="0" max="99" style="flex:1;text-align:center;">
      <span style="font-weight:600;color:#555;white-space:nowrap;">년생</span>
    </div>
    <button class="btn" id="reloginBtn" style="max-width:240px;" onclick="tryRelogin()">확인</button>
    <div class="link-row"><a href="#" onclick="showScreen('landing');return false;">돌아가기</a></div>
  </div>

  <!-- APPLICATION FORM -->
  <div id="screen-form" class="screen hidden">
    <div class="form-group">
      <label>닉네임</label>
      <input type="text" id="f-nickname" placeholder="채팅에서 사용할 이름" maxlength="12">
    </div>
    <div class="form-group">
      <label>성별</label>
      <div class="radio-row">
        <label><input type="radio" name="gender" value="여성"><span>여성</span></label>
        <label><input type="radio" name="gender" value="남성"><span>남성</span></label>
      </div>
    </div>
    <div class="form-group">
      <label>출생연도</label>
      <div style="display:flex;align-items:center;gap:8px;">
        <input type="number" id="f-birthyear" placeholder="예: 97" min="0" max="99" oninput="updateAgePreview()" style="flex:1;">
        <span style="font-weight:600;color:#555;white-space:nowrap;">년생</span>
      </div>
      <div id="agePreview" style="font-size:12px;color:var(--sub);margin-top:6px;"></div>
    </div>
    <div class="form-group">
      <label>키</label>
      <input type="number" id="f-height" placeholder="예: 170" min="120" max="220">
    </div>
    <div class="form-group">
      <label>회사명</label>
      <input type="text" id="f-company" placeholder="재직 중인 회사명" maxlength="30">
    </div>
    <div class="form-group">
      <label>사는곳</label>
      <input type="text" id="f-location" placeholder="예: 서울 강남구" maxlength="30">
    </div>
    <div class="form-group">
      <label>MBTI</label>
      <input type="text" id="f-mbti" placeholder="예: ENFP" maxlength="4" style="text-transform:uppercase;">
    </div>
    <div class="form-group">
      <label>종교</label>
      <input type="text" id="f-religion" placeholder="예: 무교" maxlength="20">
    </div>
    <div class="form-group">
      <label>한줄소개</label>
      <textarea id="f-intro" placeholder="간단한 자기소개를 남겨주세요" maxlength="80"></textarea>
    </div>
    <div class="form-group">
      <label>이상형</label>
      <textarea id="f-ideal" placeholder="원하는 이상형을 남겨주세요" maxlength="80"></textarea>
    </div>
    <div class="form-foot">
      <button class="btn" id="submitFormBtn" onclick="submitApplication()">대화방 입장</button>
    </div>
  </div>

  <!-- GUEST/ADMIN CHAT -->
  <div id="screen-chat" class="screen hidden" style="padding:0;">
    <div class="chat-header" style="flex-wrap:wrap;gap:8px;">
      <div style="display:flex;align-items:center;gap:10px;min-width:0;">
        <button id="backToListBtn" onclick="backToAdminList()" style="display:none;background:none;border:none;font-size:20px;cursor:pointer;padding:0 4px 0 0;color:var(--text);flex-shrink:0;">←</button>
        <div style="min-width:0;">
          <div class="name" id="chatPartnerName">-</div>
          <div class="info" id="chatMeta">-</div>
        </div>
      </div>
      <div style="display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex-shrink:0;">
        <select id="matchStatusSelect" class="match-status-select hidden" onchange="updateMatchStatus(currentRoomId, this.value)">
          <option value="before">매칭전</option>
          <option value="waiting">응답대기중</option>
          <option value="matched">매칭완료</option>
        </select>
        <div style="display:flex;gap:6px;flex-wrap:nowrap;">
          <button id="copyInfoBtn" class="hidden" onclick="copyApplicantInfo()" style="width:auto;padding:6px 10px;font-size:11px;white-space:nowrap;flex-shrink:0;background:#fff;border:1.5px solid var(--border);border-radius:8px;cursor:pointer;color:#555;">📋 복사</button>
          <button id="editInfoBtn" class="hidden" onclick="openAdminEdit()" style="width:auto;padding:6px 10px;font-size:11px;white-space:nowrap;flex-shrink:0;background:#fff;border:1.5px solid var(--border);border-radius:8px;cursor:pointer;color:#555;">✏️ 수정</button>
          <button class="btn danger" id="closeRoomBtn" style="width:auto;padding:8px 14px;font-size:12px;white-space:nowrap;flex-shrink:0;display:none;" onclick="closeCurrentRoom()">방 종료</button>
        </div>
      </div>
    </div>
    <div class="messages" id="messages"></div>
    <div id="closedNotice" class="hidden" style="text-align:center;color:var(--sub);font-size:13px;padding:10px;">이 대화방은 종료되었습니다.</div>
    <div class="composer" id="composer">
      <input type="file" id="imgInput" accept="image/*" style="display:none;" onchange="handleImagePick(event)">
      <button type="button" onclick="document.getElementById('imgInput').click()" style="width:auto;padding:12px 14px;background:#fff;border:1.5px solid var(--border);border-radius:10px;font-size:16px;">📷</button>
      <input type="text" id="msgInput" placeholder="메시지를 입력하세요" onkeydown="if(event.key==='Enter')sendMessage()">
      <button class="btn" onclick="sendMessage()">전송</button>
    </div>
  </div>

  <!-- ADMIN EDIT INFO -->
  <div id="screen-adminedit" class="screen hidden">
    <div class="form-group">
      <label>닉네임</label>
      <input type="text" id="e-nickname" maxlength="12">
    </div>
    <div class="form-group">
      <label>성별</label>
      <div class="radio-row">
        <label><input type="radio" name="e-gender" value="여성"><span>여성</span></label>
        <label><input type="radio" name="e-gender" value="남성"><span>남성</span></label>
      </div>
    </div>
    <div class="form-group">
      <label>출생연도</label>
      <div style="display:flex;align-items:center;gap:8px;">
        <input type="number" id="e-birthyear" min="0" max="9999" style="flex:1;">
        <span style="font-weight:600;color:#555;white-space:nowrap;">년생</span>
      </div>
    </div>
    <div class="form-group">
      <label>키</label>
      <input type="number" id="e-height" min="120" max="220">
    </div>
    <div class="form-group">
      <label>회사명</label>
      <input type="text" id="e-company" maxlength="30">
    </div>
    <div class="form-group">
      <label>사는곳</label>
      <input type="text" id="e-location" maxlength="30">
    </div>
    <div class="form-group">
      <label>MBTI</label>
      <input type="text" id="e-mbti" maxlength="4" style="text-transform:uppercase;">
    </div>
    <div class="form-group">
      <label>종교</label>
      <input type="text" id="e-religion" maxlength="20">
    </div>
    <div class="form-group">
      <label>한줄소개</label>
      <textarea id="e-intro" maxlength="80"></textarea>
    </div>
    <div class="form-group">
      <label>이상형</label>
      <textarea id="e-ideal" maxlength="80"></textarea>
    </div>
    <div class="form-foot" style="display:flex;gap:8px;">
      <button class="btn secondary" style="flex:1;" onclick="cancelAdminEdit()">취소</button>
      <button class="btn" style="flex:1;" id="saveAdminEditBtn" onclick="saveAdminEdit()">저장</button>
    </div>
  </div>

  <!-- ADMIN PASSCODE -->
  <div id="screen-adminlogin" class="screen hidden passcode-box">
    <h2>🔒 관리자 로그인</h2>
    <input type="text" id="passcodeInput" placeholder="암호 입력" style="text-align:center;max-width:200px;">
    <button class="btn" style="max-width:200px;" onclick="tryAdminLogin()">로그인</button>
    <div id="passcodeError" style="color:var(--danger);font-size:13px;display:none;">암호가 틀렸어요</div>
  </div>

  <!-- ADMIN DASHBOARD -->
  <div id="screen-admin" class="screen hidden">
    <div class="toolbar">
      <strong id="adminAsLabel">관리자</strong>
      <a href="#" onclick="switchAdminName();return false;" style="font-size:12px;color:var(--sub);">이름 변경</a>
    </div>
    <div class="gender-tabs">
      <button class="tab-btn active" data-gender="all" onclick="setGenderTab('all')">전체</button>
      <button class="tab-btn" data-gender="여성" onclick="setGenderTab('여성')">여자</button>
      <button class="tab-btn" data-gender="남성" onclick="setGenderTab('남성')">남자</button>
    </div>
    <div id="roomList"></div>
  </div>

</div>

<!-- 이미지 뷰어 (원본 화질로 확대 보기 / 복사 / 저장) -->
<div id="imageViewer" class="hidden" style="position:fixed;inset:0;background:rgba(0,0,0,0.9);z-index:1000;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;">
  <button onclick="closeImageViewer()" style="position:absolute;top:calc(16px + env(safe-area-inset-top, 0px));right:16px;background:none;border:none;color:#fff;font-size:28px;cursor:pointer;line-height:1;">✕</button>
  <img id="viewerImg" src="" style="max-width:92vw;max-height:72vh;border-radius:8px;object-fit:contain;">
  <div style="display:flex;gap:12px;margin-top:18px;">
    <button onclick="copyViewerImage()" style="padding:10px 18px;border-radius:20px;border:none;background:#fff;color:#222;font-weight:700;font-size:13px;cursor:pointer;">📋 복사</button>
    <button id="viewerSaveBtn" class="hidden" onclick="saveViewerImage()" style="padding:10px 18px;border-radius:20px;border:none;background:#6c5ce7;color:#fff;font-weight:700;font-size:13px;cursor:pointer;">💾 저장</button>
  </div>
</div>

<script type="module">
// ====== Firebase 초기화 ======
// TODO: 여기에 규리님 Firebase 콘솔에서 복사한 설정값을 붙여넣으세요.
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
import {
  getFirestore, collection, doc, addDoc, setDoc, updateDoc, onSnapshot,
  query, where, orderBy, serverTimestamp, getDoc, getDocs
} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";
import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyBPk8dpVl_n_gu0Dg7vRL3WG5nNR1KbUew",
  authDomain: "match-making-hub.firebaseapp.com",
  projectId: "match-making-hub",
  storageBucket: "match-making-hub.firebasestorage.app",
  messagingSenderId: "1043163748358",
  appId: "1:1043163748358:web:e3bd02a4b10e3ff0e44b87"
};

const ADMIN_PASSCODE = "10041004";

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

let currentUid = null;
let currentRoomId = null;
let currentRole = null; // 'guest' | 'admin'
let adminName = localStorage.getItem('adminName') || '';
let unsubMessages = null;
let unsubRooms = null;
let currentRoomData = null;

signInAnonymously(auth).then((cred) => {
  currentUid = cred.user.uid;
  boot();
}).catch((err) => {
  console.error(err);
  document.getElementById('headerSub').textContent = '연결에 문제가 있어요. 새로고침 해보세요.';
});

function boot(){
  updateNotifyBtnStates();
  const savedRoom = localStorage.getItem('myRoomId');
  const isAdmin = localStorage.getItem('isAdmin') === '1';
  if (isAdmin) {
    adminName = adminName || prompt('이름을 입력하세요 (예: 규리 / 친구)') || '관리자';
    localStorage.setItem('adminName', adminName);
    enterAdminDashboard();
  } else if (savedRoom) {
    enterGuestRoom(savedRoom);
  } else {
    showScreen('landing');
  }
}

window.showScreen = function(name){
  document.querySelectorAll('.screen').forEach(el => el.classList.add('hidden'));
  document.getElementById('screen-' + name).classList.remove('hidden');
};

window.showAdminLogin = function(){
  showScreen('adminlogin');
};

window.tryAdminLogin = function(){
  const val = document.getElementById('passcodeInput').value.trim();
  if (val === ADMIN_PASSCODE) {
    localStorage.setItem('isAdmin', '1');
    adminName = prompt('이름을 입력하세요 (예: 규리 / 친구)') || '관리자';
    localStorage.setItem('adminName', adminName);
    enterAdminDashboard();
  } else {
    document.getElementById('passcodeError').style.display = 'block';
  }
};

window.switchAdminName = function(){
  const n = prompt('이름을 입력하세요', adminName);
  if (n) { adminName = n; localStorage.setItem('adminName', n); document.getElementById('adminAsLabel').textContent = '👤 ' + n; }
};

// ====== 출생연도 -> 한국 나이 계산 ======
function getFullBirthYear(input){
  const v = parseInt(input, 10);
  if (isNaN(v)) return null;
  if (v > 999) return v; // 이미 4자리로 입력한 경우
  return v >= 30 ? 1900 + v : 2000 + v;
}
function getKoreanAge(fullBirthYear){
  const thisYear = new Date().getFullYear();
  return thisYear - fullBirthYear + 1;
}
window.updateAgePreview = function(){
  const raw = document.getElementById('f-birthyear').value.trim();
  const preview = document.getElementById('agePreview');

window.enableNotifications = async function(){
  if (!('Notification' in window)) { alert('이 브라우저는 알림 기능을 지원하지 않아요.'); return; }
  if (Notification.permission === 'granted') {
    notifyEnabled = !notifyEnabled;
  } else {
    const perm = await Notification.requestPermission();
    if (perm === 'granted') {
      notifyEnabled = true;
    } else {
      alert('알림 권한이 거부되었어요. 브라우저 사이트 설정에서 알림을 허용해주세요.');
      notifyEnabled = false;
    }
  }
  localStorage.setItem('notifyEnabled', notifyEnabled ? '1' : '0');
  updateNotifyBtnStates();
  if (notifyEnabled) playBeep();
};

function playBeep(){
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const o = ctx.createOscillator();
    const g = ctx.createGain();
    o.connect(g); g.connect(ctx.destination);
    o.frequency.value = 880;
    g.gain.value = 0.15;
    o.start();
    setTimeout(() => { o.stop(); ctx.close(); }, 180);
  } catch(e) {}
}

function notifyNewMessage(m){

  if (Notification.permission === 'granted') {
    try {
      new Notification('새 메시지 💬', {

}

  if (unsubMessages) unsubMessages();

  const q = query(collection(db, 'rooms', roomId, 'messages'), orderBy('createdAt', 'asc'));
  unsubMessages = onSnapshot(q, (snap) => {

  });
}

// ====== 이미지 첨부 ======
function resizeAndCompress(file, maxDim, quality){
  return new Promise((resolve, reject) => {
    const img = new Image();
    const reader = new FileReader();
    reader.onload = () => { img.src = reader.result; };
    reader.onerror = reject;
    img.onload = () => {
      let { width, height } = img;
      if (width > height && width > maxDim) { height = height * (maxDim / width); width = maxDim; }
      else if (height > maxDim) { width = width * (maxDim / height); height = maxDim; }
      const canvas = document.createElement('canvas');
      canvas.width = width; canvas.height = height;
      canvas.getContext('2d').drawImage(img, 0, 0, width, height);
      resolve(canvas.toDataURL('image/jpeg', quality));
    };
    img.onerror = reject;
    reader.readAsDataURL(file);
  });
}

window.handleImagePick = async function(event){
  const file = event.target.files[0];
  event.target.value = '';
  if (!file || !currentRoomId) return;

  let dataUrl = await resizeAndCompress(file, 900, 0.6);
  // Firestore 문서 용량(256KB) 안에 들어오도록 필요하면 더 압축
  let quality = 0.6, maxDim = 900;
  while (dataUrl.length > 220000 && quality > 0.2) {
    quality -= 0.15; maxDim = Math.max(400, maxDim - 150);
    dataUrl = await resizeAndCompress(file, maxDim, quality);
  }
  if (dataUrl.length > 260000) {
    alert('이미지 용량이 너무 커서 전송할 수 없어요. 다른 사진으로 시도해주세요.');
    return;
  }

  const senderName = currentRole === 'admin' ? adminName : '나';
  try {
    await addDoc(collection(db, 'rooms', currentRoomId, 'messages'), {
      sender: currentRole, name: senderName, type: 'image', imageData: dataUrl,
      createdAt: serverTimestamp()
    });
    await updateDoc(doc(db, 'rooms', currentRoomId), {
      lastMessageAt: serverTimestamp(), lastMessageSender: currentRole, hasImage: true
    });
  } catch (e) {
    console.error(e);
    alert('이미지 전송에 실패했어요.');
  }
};

const MATCH_STATUS_LABEL = { before: '매칭전', waiting: '응답대기중', matched: '매칭완료' };
const MATCH_STATUS_ORDER = { waiting: 0, before: 1, matched: 2 };

// ====== 간단한 궁합 추천 (서버/AI 호출 없이 브라우저에서 바로 계산되는 규칙 기반 추천) ======
const MBTI_COMPAT = {
  INFP:['ENFJ','ENTJ'], ENFP:['INFJ','INTJ'], INFJ:['ENFP','ENTP'], ENFJ:['INFP','ISFP'],
  INTJ:['ENFP','ENTP'], ENTJ:['INFP','INTP'], INTP:['ENTJ','ESTJ'], ENTP:['INFJ','INTJ'],
  ISFP:['ENFJ','ESFJ'], ESFP:['ISFJ','ISTJ'], ISFJ:['ESFP','ESTP'], ESFJ:['ISFP','ISTP'],
  ISTP:['ESFJ','ESTJ'], ESTP:['ISFJ','ISTJ'], ISTJ:['ESFP','ESTP'], ESTJ:['ISTP','INTP']
};

function tokenize(text){
  if (!text) return [];
  return text.toLowerCase()
    .replace(/[.,!?~^()\[\]{}'"“”‘’:;/\\|·]/g, ' ')
    .split(/\s+/)
    .filter(w => w.length >= 2);
}

function computeMatchScore(person, candidate){
  let score = 0;
  if (person.age && candidate.age) score += Math.max(0, 5 - Math.abs(person.age - candidate.age));
  const candText = [candidate.mbti, candidate.location, candidate.company, candidate.intro, candidate.religion].join(' ');
  const candWords = new Set(tokenize(candText));
  tokenize(person.ideal).forEach(w => { if (candWords.has(w)) score += 3; });
  const personText = [person.mbti, person.location, person.company, person.intro, person.religion].join(' ');
  const personWords = new Set(tokenize(personText));
  tokenize(candidate.ideal).forEach(w => { if (personWords.has(w)) score += 3; });
  if (person.mbti && candidate.mbti) {
    const p = person.mbti.toUpperCase(), c = candidate.mbti.toUpperCase();
    if (MBTI_COMPAT[p] && MBTI_COMPAT[p].includes(c)) score += 4;
  }
  if (person.location && candidate.location) {
    if (tokenize(person.location).some(w => tokenize(candidate.location).includes(w))) score += 2;
  }
  return score;
}

function findBestMatches(selfId, self, allRooms){
  const opposite = self.gender === '여성' ? '남성' : (self.gender === '남성' ? '여성' : null);
  if (!opposite) return [];
  const candidates = allRooms.filter(o => o.id !== selfId && o.data.gender === opposite && o.data.status !== 'closed');
  return candidates
    .map(o => ({ nickname: o.data.nickname || '익명', score: computeMatchScore(self, o.data) }))
    .sort((a, b) => b.score - a.score)
    .slice(0, 3);
}

function isRoomUnread(d){
  const r = d.data();
  if (r.lastMessageSender !== 'guest' || !r.lastMessageAt || !r.lastMessageAt.toMillis) return false;
  const lastMsgAt = r.lastMessageAt.toMillis();
  const lastReadAt = parseInt(localStorage.getItem('lastRead_' + d.id) || '0', 10);
  return lastMsgAt > lastReadAt;
}

function renderRoomList(){
  const activeDocs = lastRoomDocs.filter(d => d.data().status !== 'closed');
  const total = activeDocs.length;
  const femaleCount = activeDocs.filter(d => d.data().gender === '여성').length;
  const maleCount = activeDocs.filter(d => d.data().gender === '남성').length;
  document.querySelector('.tab-btn[data-gender="all"]').textContent = `전체 (${total})`;
  document.querySelector('.tab-btn[data-gender="여성"]').textContent = `여자 (${femaleCount})`;
  document.querySelector('.tab-btn[data-gender="남성"]').textContent = `남자 (${maleCount})`;

  const allRooms = lastRoomDocs.map(d => ({ id: d.id, data: d.data() }));

  const list = document.getElementById('roomList');
  list.innerHTML = '';
  const filtered = lastRoomDocs.filter(d => currentGenderTab === 'all' || d.data().gender === currentGenderTab);
  if (filtered.length === 0) {
    list.innerHTML = '<div class="empty">신청 내역이 없어요</div>';
    return;
  }
  function sortTier(d){
    if (isRoomUnread(d)) return 0;
    if (d.data().status === 'closed') return 100;
    return 1 + (MATCH_STATUS_ORDER[d.data().matchStatus || 'before'] ?? 1);
  }
  filtered.sort((a, b) => sortTier(a) - sortTier(b));
  filtered.forEach(d => {
    const r = d.data();
    const matchStatus = r.matchStatus || 'before';
    const matches = findBestMatches(d.id, r, allRooms);
    const unread = isRoomUnread(d);
    const card = document.createElement('div');
    card.className = 'room-card status-' + matchStatus + (r.status === 'closed' ? ' closed' : '');
    card.onclick = () => enterAdminRoom(d.id, r);
    card.innerHTML = `
      <div class="top">
        <span class="nickname">${escapeHtml(r.nickname || '익명')}${unread ? '<span class="unread-dot"></span>' : ''}</span>
        <span style="display:flex;gap:4px;">
          ${r.hasImage ? '<span class="tag photo-tag">📷 사진</span>' : ''}
          <span class="tag ${r.status === 'closed' ? 'closed' : ''}">${r.status === 'closed' ? '종료' : '진행중'}</span>
        </span>
      </div>
      <div class="meta">${escapeHtml(r.gender||'')} · ${escapeHtml(String(r.age||''))}세(${escapeHtml(String(r.birthYear||'-'))}) · ${escapeHtml(r.height?r.height+'cm':'-')} · ${escapeHtml(r.mbti||'-')}</div>
      <div class="meta">${escapeHtml(r.company||'-')} · ${escapeHtml(r.location||'-')} · ${escapeHtml(r.religion||'-')}</div>
      <div class="intro">${escapeHtml(r.intro||'')}</div>
      ${r.ideal ? `<div class="intro">💛 이상형: ${escapeHtml(r.ideal)}</div>` : ''}
      ${matches.length ? `<div class="match-suggest">💡 잘 어울리는 분: ${matches.map(m => escapeHtml(m.nickname)).join(', ')}</div>` : ''}
      <div class="match-status-row">
        <select class="match-status-select" onchange="updateMatchStatus('${d.id}', this.value)">
          <option value="before" ${matchStatus==='before'?'selected':''}>매칭전</option>
          <option value="waiting" ${matchStatus==='waiting'?'selected':''}>응답대기중</option>
          <option value="matched" ${matchStatus==='matched'?'selected':''}>매칭완료</option>
        </select>
      </div>
    `;
    card.querySelector('.match-status-select').addEventListener('click', (e) => e.stopPropagation());
    list.appendChild(card);
  });
}

window.saveAdminEdit = async function(){
  if (!currentRoomId) return;
  const nickname = document.getElementById('e-nickname').value.trim();
  const genderEl = document.querySelector('input[name=e-gender]:checked');
  const birthYearRaw = document.getElementById('e-birthyear').value.trim();
  const height = document.getElementById('e-height').value.trim();
  const company = document.getElementById('e-company').value.trim();
  const location = document.getElementById('e-location').value.trim();
  const mbti = document.getElementById('e-mbti').value.trim().toUpperCase();
  const religion = document.getElementById('e-religion').value.trim();
  const intro = document.getElementById('e-intro').value.trim();
  const ideal = document.getElementById('e-ideal').value.trim();

  const fullBirthYear = getFullBirthYear(birthYearRaw);
  if (!nickname || !genderEl || !fullBirthYear) {
    alert('닉네임, 성별, 출생연도는 꼭 입력해주세요.');
    return;
  }
  const age = getKoreanAge(fullBirthYear);

  const btn = document.getElementById('saveAdminEditBtn');
  btn.disabled = true; btn.textContent = '저장 중...';
  try {
    await updateDoc(doc(db, 'rooms', currentRoomId), {
      nickname, gender: genderEl.value, birthYear: fullBirthYear, age,
      height, company, location, mbti, religion, intro, ideal
    });
    const snap = await getDoc(doc(db, 'rooms', currentRoomId));
    const room = snap.data();
    currentRoomData = room;
    document.getElementById('chatPartnerName').textContent = room.nickname + ' 님';
    document.getElementById('chatMeta').textContent = `${room.gender||''} · ${room.age||''}세(${room.birthYear||'-'}) · ${room.height?room.height+'cm':'-'} · ${room.mbti||'-'} · ${room.company||'-'} · ${room.location||'-'} · ${room.religion||'-'}`;
    showScreen('chat');
  } catch (e) {
    console.error(e);
    alert('저장에 실패했어요.');
  } finally {
    btn.disabled = false; btn.textContent = '저장';
  }
};

function escapeHtml(str){
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}

// 메시지 안의 링크(URL)를 클릭 가능하게 변환 (escapeHtml로 이스케이프된 텍스트에 적용)
function linkify(escapedText){
  const urlRegex = /(https?:\/\/[^\s<]+)/g;
  return escapedText.replace(urlRegex, (url) => {
    let trail = '';
    let cleanUrl = url;
    const trailMatch = cleanUrl.match(/([)\].,!?;:'"]+)$/);
    if (trailMatch) {
      trail = trailMatch[1];
      cleanUrl = cleanUrl.slice(0, -trail.length);
    }
    return `<a href="${cleanUrl}" target="_blank" rel="noopener noreferrer" style="color:inherit;text-decoration:underline;word-break:break-all;">${cleanUrl}</a>${trail}`;
  });
}

// 메시지 보낸 시각 표시
function formatMsgTime(ts){
  if (!ts || !ts.toDate) return '';
  const d = ts.toDate();
  const mm = d.getMonth() + 1;
  const dd = d.getDate();
  const hh = String(d.getHours()).padStart(2, '0');
  const mi = String(d.getMinutes()).padStart(2, '0');
  return `${mm}/${dd} ${hh}:${mi}`;
}

// ====== 이미지 뷰어 (원본 화질 그대로 보기 / 복사 / 관리자 저장) ======
let viewerImageData = null;

window.openImageViewer = function(dataUrl, isAdmin){
  viewerImageData = dataUrl;
  document.getElementById('viewerImg').src = dataUrl;
  document.getElementById('viewerSaveBtn').classList.toggle('hidden', !isAdmin);
  document.getElementById('imageViewer').classList.remove('hidden');
};

window.closeImageViewer = function(){
  document.getElementById('imageViewer').classList.add('hidden');
  viewerImageData = null;
};

window.copyViewerImage = async function(){
  if (!viewerImageData) return;
  try {
    const img = new Image();
    img.src = viewerImageData;
    await new Promise((resolve, reject) => { img.onload = resolve; img.onerror = reject; });
    const canvas = document.createElement('canvas');
    canvas.width = img.naturalWidth;
    canvas.height = img.naturalHeight;
    canvas.getContext('2d').drawImage(img, 0, 0);
    const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/png'));
    await navigator.clipboard.write([ new ClipboardItem({ 'image/png': blob }) ]);
    alert('이미지를 복사했어요! 원하는 곳에 붙여넣기 해보세요.');
  } catch (e) {
    console.error(e);
    alert('이 브라우저에서는 이미지 복사가 지원되지 않아요. "저장" 버튼을 이용해주세요.');
  }
};

window.saveViewerImage = function(){
  if (!viewerImageData) return;
  const a = document.createElement('a');
  a.href = viewerImageData;
  a.download = 'photo_' + Date.now() + '.jpg';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
};
